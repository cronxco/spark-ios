name: iOS CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    env:
      # The image includes 27.3 beta, but still defaults to Xcode 27.1.
      DEVELOPER_DIR: /Applications/Xcode_27.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install iOS 27.3 simulator
        run: |
          # runner-images adds Xcode 27.3 without its simulator runtimes.
          xcodebuild -downloadPlatform iOS -buildVersion 27.3
          xcrun simctl create 'Spark CI' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro-Max \
            com.apple.CoreSimulator.SimRuntime.iOS-27-3

      - name: Install tuist
        run: brew install tuist

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-27.3-beta-deriveddata-${{ hashFiles('Project.swift', 'Packages/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-27.3-beta-deriveddata-

      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-27.3-beta-spm-${{ hashFiles('Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-27.3-beta-spm-

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Build + test SparkKit
        working-directory: Packages/SparkKit
        run: swift test --parallel

      - name: Build + test SparkApp
        run: |
          # Without pipefail the pipeline reports xcbeautify's status, not
          # xcodebuild's, so a failed build went green and `|| exit
          # ${PIPESTATUS[0]}` never ran. GitHub Actions uses `bash -e`, which
          # does not set pipefail.
          set -o pipefail
          xcodebuild \
            -workspace Spark.xcworkspace \
            -scheme SparkApp \
            -destination 'platform=iOS Simulator,name=Spark CI,OS=27.3' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            test \
          | xcbeautify --renderer github-actions || exit ${PIPESTATUS[0]}

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-${{ github.run_id }}
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
